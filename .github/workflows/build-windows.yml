name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [claude/vigilant-maxwell-08y2xx]
    paths: ['main.js', 'preload.js', 'renderer/**', 'tools/**', 'assets/**', 'package.json', '.github/workflows/build-windows.yml']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Agent-Dashboard-Setup
          path: dist/*.exe
